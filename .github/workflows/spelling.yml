name: Spelling

on:
  workflow_call:
  workflow_dispatch:

jobs:
  spelling:
    name: Check Spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Run CSpell
        uses: streetsidesoftware/cspell-action@6775881c37fa4d293f36b318316d59d03c839b39 # v9.3.0
        with:
          config: 'cspell.jsonc'
          # Check the current directory recursively
          files: '.'
          # Fail the build on spelling errors
          strict: true
