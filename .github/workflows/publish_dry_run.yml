name: Publish Dry Run

on:
  workflow_call:
  workflow_dispatch:

jobs:
  publish-dry-run:
    name: Publish Dry Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Levit
        uses: ./.github/actions/setup-levit
        with:
          pub-cache-suffix: ${{ hashFiles('**/pubspec.yaml', 'melos.yaml') }}

      - name: Build DevTools web extension
        run: dart run melos run build:devtools

      - name: Publish dry-run
        run: dart run melos publish --dry-run --yes
