name: Setup Levit
description: Install Flutter with SDK/pub caching and bootstrap the Melos workspace.

inputs:
  channel:
    description: Flutter release channel
    required: false
    default: stable
  flutter-version:
    description: Validated 0.1.0 release toolchain (matches .fvmrc; includes Dart 3.10.9)
    required: false
    default: '3.38.10'
  bootstrap:
    description: Run dart pub get and melos bootstrap
    required: false
    default: 'true'
  pub-cache-suffix:
    description: >
      Cache-busting suffix for pub dependencies. Pass
      hashFiles('**/pubspec.yaml', 'melos.yaml') from the workflow
      (hashFiles is not available inside composite actions).
    required: true

runs:
  using: composite
  steps:
    - name: Set up Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        channel: ${{ inputs.channel }}
        flutter-version: ${{ inputs.flutter-version }}
        cache: true
        pub-cache: true
        # No pubspec.lock files in this monorepo; key on manifests via caller suffix.
        pub-cache-key: levit-pub-:os:-:channel:-:version:-:arch:-${{ inputs.pub-cache-suffix }}

    - name: Install root dependencies
      if: inputs.bootstrap == 'true'
      shell: bash
      run: |
        echo "MELOS_SDK_PATH=$FLUTTER_ROOT" >> "$GITHUB_ENV"
        dart pub global activate melos 6.3.3
        echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"
        dart pub get

    - name: Bootstrap workspace
      if: inputs.bootstrap == 'true'
      shell: bash
      run: dart run melos bootstrap
